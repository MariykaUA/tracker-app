body { margin: 0; }
* { box-sizing: border-box; }
.tj-blur { -webkit-backdrop-filter: blur(20px) saturate(1.5); backdrop-filter: blur(20px) saturate(1.5); }

  to { opacity: 1; transform: none; }

  to { opacity: 1; }

.tj-bob { animation: tj-bob 3.2s ease-in-out infinite; }

  50% { transform: scale(1.03, .97); }

.tj-bar { animation: tj-grow 600ms cubic-bezier(.3, 1.3, .5, 1) both; transform-origin: 50% 100%; }
